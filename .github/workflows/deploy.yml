name: Build and deploy to Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    # Weekly: pick up new Pokémon, moves, items and translations from PokeAPI.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Without the service-account secret the job still builds and tests, and skips only the deploy.
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOKEDEX != '' }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # The PokeAPI data mirror is large; reuse the previous clone and just pull the newest commit.
      - uses: actions/cache@v4
        with:
          path: .cache/api-data
          key: api-data-${{ github.run_id }}
          restore-keys: api-data-

      - name: Build the dataset from the newest PokeAPI data
        run: npm run ingest -- --update

      - run: npm test

      - name: Has the data changed since the last deploy?
        id: freshness
        run: |
          new=$(node -p "require('./data/generated/manifest.json').sourceCommit")
          live=$(curl -fsS https://bokedex.web.app/data/manifest.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).sourceCommit" 2>/dev/null || echo none)
          echo "new data: $new / live data: $live"
          # A scheduled run with nothing new has nothing to publish. Pushes and manual runs always deploy.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$new" = "$live" ]; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the site
        if: steps.freshness.outputs.publish == 'true'
        run: npm run generate

      - name: Deploy to Firebase Hosting
        if: steps.freshness.outputs.publish == 'true' && env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BOKEDEX }}
          projectId: bokedex
          channelId: live
